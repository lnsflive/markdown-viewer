[package]
name = "markdown-viewer"
version = "1.0.0"
edition = "2021"

[lib]
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.6"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-clipboard-manager = "2.4.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }
winreg = "0.55"
